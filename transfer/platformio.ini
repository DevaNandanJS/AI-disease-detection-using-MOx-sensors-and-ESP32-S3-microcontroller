; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3_generic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Serial Monitor Configuration ---
monitor_speed = 115200

; --- Board/Hardware Configuration ---
; Enable Octal PSRAM and set flash to QIO 80MHz
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_opts.board_build.psram_type = opi

; --- Partition Scheme ---
; Use a custom partition table to allocate a large app partition and
; a dedicated LittleFS partition for the test data.
board_build.partitions = partitions.csv

; --- Filesystem ---
; Define the filesystem type and the directory to build and upload.
; pio run -t uploadfs
board_build.filesystem = littlefs
extra_scripts = pio_littlefs_extra.py

; --- Build Flags ---
; -O3 for max speed optimization
; -DCORE_DEBUG_LEVEL=0 to disable verbose logging and save space
; -DARDUINO_USB_CDC_ON_BOOT=1 enables Serial on boot
; -DBOARD_HAS_PSRAM tells the compiler to enable PSRAM support
build_flags =
    -O3
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; --- Library Dependencies ---
; LittleFS is required for the data pipeline.
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/lorol/LITTLEFS.git
