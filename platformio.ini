; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3_generic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Serial Monitor Configuration ---
monitor_speed = 115200

; --- Filesystem & Partition Scheme ---
; Use LittleFS for the onboard flash filesystem.
; The 'data' directory in the project root will be packaged into a
; LittleFS image and flashed to the board. Place your 'test.csv' there.
board_build.filesystem = littlefs

; Use a custom partition table to allocate a large app partition.
; This is necessary because transpiled ML models can result in a large
; binary. The 'huge_app.csv' file defines a 3MB app partition and a
; 1MB LittleFS data partition.
board_build.partitions = huge_app.csv

; --- Build Flags ---
; Enable C++17 standard for modern features if needed
build_flags = -std=gnu++17

; --- Library Dependencies ---
; No external libraries needed beyond the framework defaults for this task.
lib_deps =
